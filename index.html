
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA Physical Checking</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 15px;
  color: #222;
}

.container {
  background: white;
  max-width: 450px;
  margin: auto;
  padding: 22px;
  border-radius: 12px;
}

h2 { text-align: center; margin-bottom: 22px; }

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 7px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

input[readonly] { background: #eee; }

button {
  padding: 14px;
  font-size: 15px;
  border: none;
  border-radius: 9px;
  cursor: pointer;
}

button:disabled { opacity: 0.5; }

.modeButtons {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.modeButtons button {
  flex: 1;
  background: #e5e7eb;
}

.modeButtons button.active {
  background: #1769aa;
  color: white;
}

.scan {
  background: #333;
  color: white;
  width: 100%;
}

.submit {
  background: #1769aa;
  color: white;
  width: 100%;
  margin-top: 24px;
}

#reader { width: 100%; margin-top: 12px; }

#message {
  margin-top: 15px;
  font-weight: bold;
  text-align: center;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 8px;
}

.hidden { display: none; }
</style>
</head>

<body>
<div class="container">

<h2>FA Physical Checking</h2>

<div class="modeButtons">
  <button id="scanMode" class="active"
          type="button" onclick="setMode('scan')">
    Scan QR
  </button>
  <button id="manualMode"
          type="button" onclick="setMode('manual')">
    Manual Entry
  </button>
</div>

<div id="scanSection">
  <button class="scan" id="scanBtn"
          type="button" onclick="startScanner()">
    📷 เปิดกล้อง Scan QR
  </button>
  <div id="reader"></div>
</div>

<div id="manualNote" class="note hidden">
  ใช้เมื่อ QR Tag หาย ชำรุด หรือไม่สามารถสแกนได้
</div>

<form id="assetForm">

  <label>Asset No. *</label>
  <input id="assetNo" readonly required
         placeholder="กรุณาสแกน QR">

  <label>Status *</label>
  <select id="status" required>
    <option value="">-- เลือก Status --</option>
    <option value="Found">Found</option>
    <option value="Not Found">Not Found</option>
  </select>

  <label>Condition *</label>
  <select id="condition" required>
    <option value="">-- เลือก Condition --</option>
    <option value="Good">Good</option>
    <option value="Damaged">Damaged</option>
  </select>

  <label>Location *</label>
  <select id="location" required>
    <option value="">-- เลือก Location --</option>
    <option value="HQ-OFFICE">HQ-OFFICE</option>
    <option value="WH-2">WH-2</option>
    <option value="WH-3">WH-3</option>
    <option value="WH-4">WH-4</option>
    <option value="SAMRONG">SAMRONG</option>
    <option value="MP-M">MP-M</option>
    <option value="MP-I">MP-I</option>
  </select>

  <label>Owner</label>
  <input id="owner" type="text"
         placeholder="กรอกชื่อผู้รับผิดชอบ (ถ้ามี)">

  <label>Remark</label>
  <textarea id="remark" rows="3"
            placeholder="หมายเหตุ (ถ้ามี)"></textarea>

  <button id="submitBtn" class="submit" type="submit">
    ส่งข้อมูล
  </button>
</form>

<p id="message"></p>
</div>

<iframe name="submitFrame" style="display:none"></iframe>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwezB2j68Bz65FXjJUSEFZIPJUTtvHp4-UDb3k8apBi9teP886Cd4lEqnDSiKvUbtjC/exec";

const $ = id => document.getElementById(id);

let scanner = null;
let starting = false;
let scanLocked = false;
let sending = false;
let currentMode = "scan";

function message(text) {
  $("message").textContent = text;
}

async function stopScanner() {
  if (!scanner) return;

  const current = scanner;
  scanner = null;

  try {
    if (current.isScanning) await current.stop();
  } catch (e) {}

  try { current.clear(); } catch (e) {}
}

async function setMode(mode) {
  if (sending || starting) return;

  await stopScanner();

  currentMode = mode;
  scanLocked = false;

  $("scanSection").classList.toggle(
    "hidden", mode !== "scan"
  );

  $("manualNote").classList.toggle(
    "hidden", mode !== "manual"
  );

  $("scanMode").classList.toggle(
    "active", mode === "scan"
  );

  $("manualMode").classList.toggle(
    "active", mode === "manual"
  );

  $("assetNo").value = "";
  $("assetNo").readOnly = mode === "scan";

  $("assetNo").placeholder = mode === "scan"
    ? "กรุณาสแกน QR"
    : "กรอก Asset No. ด้วยตนเอง";

  message("");

  if (mode === "manual") $("assetNo").focus();
}

async function startScanner() {
  if (scanner || starting || sending) return;

  if (!window.Html5Qrcode) {
    message("โหลด QR Scanner ไม่สำเร็จ");
    return;
  }

  starting = true;
  scanLocked = false;
  $("scanBtn").disabled = true;

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: (width, height) => {
          const size = Math.floor(
            Math.min(width, height) * 0.85
          );
          return { width: size, height: size };
        }
      },
      async decodedText => {
        if (scanLocked) return;
        scanLocked = true;

        // Keep exactly the decoded QR text.
        $("assetNo").value = decodedText;
        message("สแกน QR สำเร็จ");

        await stopScanner();
      },
      () => {}
    );

  } catch (error) {
    message("เปิดกล้องไม่สำเร็จ: " + error.message);
    await stopScanner();

  } finally {
    starting = false;
    $("scanBtn").disabled = false;
  }
}

$("assetForm").addEventListener("submit", event => {
  event.preventDefault();
  if (sending) return;

  const data = {
    assetNo: $("assetNo").value,
    status: $("status").value,
    condition: $("condition").value,
    location: $("location").value,
    owner: $("owner").value,
    remark: $("remark").value
  };

  if (!data.assetNo) {
    message("กรุณาสแกนหรือกรอก Asset No.");
    return;
  }

  sending = true;
  const btn = $("submitBtn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งข้อมูล...";

  const form = document.createElement("form");
  form.method = "POST";
  form.action = API_URL;
  form.target = "submitFrame";
  form.style.display = "none";

  const input = document.createElement("input");
  input.type = "hidden";
  input.name = "payload";
  input.value = JSON.stringify(data);

  form.appendChild(input);
  document.body.appendChild(form);

  form.submit();
  form.remove();

  message("กำลังส่งข้อมูล...");

  // Reset after 2 seconds (not server confirmation).
  setTimeout(() => {
    $("assetForm").reset();
    $("assetNo").value = "";

    sending = false;
    scanLocked = false;
    btn.disabled = false;
    btn.textContent = "ส่งข้อมูล";

    message("ส่งคำขอแล้ว พร้อมสแกน QR รายการถัดไป");
  }, 2000);
});
</script>
</body>
</html>
