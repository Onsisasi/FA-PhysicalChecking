
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA Physical Checking</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  margin: 0;
  padding: 15px;
  color: #222;
}

.container {
  background: white;
  max-width: 450px;
  margin: auto;
  padding: 22px;
  border-radius: 12px;
}

h2 {
  text-align: center;
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 7px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

input[readonly] { background: #eee; }

button {
  padding: 14px;
  font-size: 15px;
  border: none;
  border-radius: 9px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.modeButtons, .cameraTools {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}

.modeButtons button, .cameraTools button {
  flex: 1;
}

.modeButtons button {
  background: #e5e7eb;
}

.modeButtons button.active {
  background: #1769aa;
  color: white;
}

.scan {
  background: #333;
  color: white;
  width: 100%;
}

.submit {
  background: #1769aa;
  color: white;
  width: 100%;
  margin-top: 24px;
}

.cameraTools button {
  background: #e5e7eb;
  font-size: 13px;
}

#reader {
  width: 100%;
  margin-top: 12px;
}

#message {
  margin-top: 15px;
  font-weight: bold;
  text-align: center;
  white-space: pre-wrap;
}

.note {
  font-size: 13px;
  color: #666;
  margin-top: 8px;
}

.hidden { display: none; }
</style>
</head>

<body>
<div class="container">

<h2>FA Physical Checking</h2>

<div class="modeButtons">
  <button id="scanMode" class="active"
          type="button" onclick="setMode('scan')">
    Scan QR
  </button>

  <button id="manualMode"
          type="button" onclick="setMode('manual')">
    Manual Entry
  </button>
</div>

<div id="scanSection">
  <button id="scanBtn" class="scan"
          type="button" onclick="startScanner()">
    📷 เปิดกล้อง Scan QR
  </button>

  <div id="reader"></div>

  <div class="cameraTools">
    <button type="button" onclick="switchCamera()">
      🔄 เปลี่ยนกล้อง
    </button>

    <button type="button" onclick="toggleTorch()">
      🔦 ไฟฉาย
    </button>
  </div>

  <button type="button" onclick="stopScanner()"
          style="width:100%;background:#e5e7eb;">
    หยุดกล้อง
  </button>
</div>

<div id="manualNote" class="note hidden">
  ใช้เมื่อ QR Tag หาย ชำรุด หรือไม่สามารถสแกนได้
</div>

<form id="assetForm">

  <label>Asset No. *</label>
  <input id="assetNo" readonly required
         placeholder="กรุณาสแกน QR">

  <label>Status *</label>
  <select id="status" required>
    <option value="">-- เลือก Status --</option>
    <option value="Found">Found</option>
    <option value="Not Found">Not Found</option>
  </select>

  <label>Condition *</label>
  <select id="condition" required>
    <option value="">-- เลือก Condition --</option>
    <option value="Good">Good</option>
    <option value="Damaged">Damaged</option>
  </select>

  <label>Location *</label>
  <select id="location" required>
    <option value="">-- เลือก Location --</option>
    <option value="HQ-OFFICE">HQ-OFFICE</option>
    <option value="WH-2">WH-2</option>
    <option value="WH-3">WH-3</option>
    <option value="WH-4">WH-4</option>
    <option value="SAMRONG">SAMRONG</option>
    <option value="MP-M">MP-M</option>
    <option value="MP-I">MP-I</option>
  </select>

  <label>Owner</label>
  <input id="owner" type="text"
         placeholder="กรอกชื่อผู้รับผิดชอบ (ถ้ามี)">

  <label>Remark</label>
  <textarea id="remark" rows="3"
            placeholder="หมายเหตุ (ถ้ามี)"></textarea>

  <button id="submitBtn" class="submit" type="submit">
    ส่งข้อมูล
  </button>
</form>

<p id="message"></p>
</div>

<iframe name="submitFrame" id="submitFrame"
        style="display:none"></iframe>

<script>
// ===== CONFIGURATION =====
const API_URL = "https://script.google.com/macros/s/AKfycbwezB2j68Bz65FXjJUSEFZIPJUTtvHp4-UDb3k8apBi9teP886Cd4lEqnDSiKvUbtjC/exec";

// ===== VARIABLES =====
const $ = id => document.getElementById(id);

let scanner = null;
let cameraIds = [];
let cameraIndex = 0;
let torchOn = false;
let scanLocked = false;
let starting = false;
let sending = false;
let currentMode = "scan";

function message(text, color = "#333") {
  $("message").textContent = text;
  $("message").style.color = color;
}

// ===== SCAN / MANUAL MODE =====
async function setMode(mode) {
  if (sending || starting) return;

  await stopScanner();

  currentMode = mode;

  $("scanSection").classList.toggle(
    "hidden", mode !== "scan"
  );

  $("manualNote").classList.toggle(
    "hidden", mode !== "manual"
  );

  $("scanMode").classList.toggle(
    "active", mode === "scan"
  );

  $("manualMode").classList.toggle(
    "active", mode === "manual"
  );

  $("assetNo").value = "";
  $("assetNo").readOnly = mode === "scan";

  $("assetNo").placeholder = mode === "scan"
    ? "กรุณาสแกน QR"
    : "กรอก Asset No. ด้วยตนเอง";

  scanLocked = false;
  message("");

  if (mode === "manual") {
    $("assetNo").focus();
  }
}

// ===== SCANNER CONFIGURATION =====
function scannerConfig() {
  return {
    fps: 15,
    qrbox: (width, height) => {
      const size = Math.floor(
        Math.min(width, height) * 0.85
      );
      return { width: size, height: size };
    },
    disableFlip: true
  };
}

// ===== START SCANNER =====
async function startScanner() {
  if (scanner || starting || sending) return;

  if (!window.Html5Qrcode) {
    message("ไม่สามารถโหลด QR Scanner ได้", "red");
    return;
  }

  starting = true;
  scanLocked = false;
  $("scanBtn").disabled = true;
  message("กำลังเปิดกล้อง...");

  try {
    scanner = new Html5Qrcode("reader");

    const cameras = await Html5Qrcode.getCameras();
    cameraIds = cameras.map(c => c.id);

    if (!cameraIds.length) {
      throw new Error("ไม่พบกล้อง");
    }

    let backIndex = cameras.findIndex(c =>
      /back|rear|environment/i.test(c.label)
    );

    if (backIndex < 0) {
      backIndex = cameras.length - 1;
    }

    cameraIndex = backIndex;

    await scanner.start(
      cameraIds[cameraIndex],
      scannerConfig(),
      onScanSuccess,
      () => {}
    );

    message("พร้อมสแกน QR", "green");

  } catch (error) {
    message(
      "เปิดกล้องไม่สำเร็จ: " + error.message,
      "red"
    );
    await stopScanner();

  } finally {
    starting = false;
    $("scanBtn").disabled = false;
  }
}

// ===== QR SCAN RESULT =====
async function onScanSuccess(decodedText) {
  if (scanLocked || sending) return;

  scanLocked = true;

  // Keep the original QR text exactly as decoded.
  $("assetNo").value = decodedText;

  message("สแกน QR สำเร็จ", "green");

  await stopScanner();
}

// ===== STOP CAMERA =====
async function stopScanner() {
  if (!scanner) return;

  const current = scanner;
  scanner = null;
  torchOn = false;

  try {
    if (current.isScanning) {
      await current.stop();
    }
  } catch (e) {}

  try {
    current.clear();
  } catch (e) {}
}

// ===== SWITCH CAMERA =====
async function switchCamera() {
  if (starting || sending) return;

  if (cameraIds.length < 2) {
    message("ไม่พบกล้องอื่นให้เปลี่ยน", "red");
    return;
  }

  cameraIndex = (cameraIndex + 1) % cameraIds.length;

  await stopScanner();

  starting = true;
  $("scanBtn").disabled = true;

  try {
    scanner = new Html5Qrcode("reader");
    scanLocked = false;

    await scanner.start(
      cameraIds[cameraIndex],
      scannerConfig(),
      onScanSuccess,
      () => {}
    );

    message("เปลี่ยนกล้องเรียบร้อย", "green");

  } catch (error) {
    message(
      "เปลี่ยนกล้องไม่สำเร็จ: " + error.message,
      "red"
    );
    await stopScanner();

  } finally {
    starting = false;
    $("scanBtn").disabled = false;
  }
}

// ===== FLASHLIGHT =====
async function toggleTorch() {
  if (!scanner || !scanner.isScanning) {
    message("กรุณาเปิดกล้องก่อน", "red");
    return;
  }

  try {
    const caps = scanner.getRunningTrackCapabilities();

    if (!caps.torch) {
      message("มือถือไม่รองรับไฟฉายผ่านเว็บ", "red");
      return;
    }

    torchOn = !torchOn;

    await scanner.applyVideoConstraints({
      advanced: [{ torch: torchOn }]
    });

    message(
      torchOn ? "เปิดไฟฉายแล้ว" : "ปิดไฟฉายแล้ว",
      "green"
    );

  } catch (error) {
    torchOn = false;
    message("ไม่สามารถเปิดไฟฉายได้", "red");
  }
}

// ===== SUBMIT TO GOOGLE SHEETS =====
$("assetForm").addEventListener("submit", event => {
  event.preventDefault();

  if (sending) return;

  const data = {
    assetNo: $("assetNo").value,
    status: $("status").value,
    condition: $("condition").value,
    location: $("location").value,
    owner: $("owner").value,
    remark: $("remark").value
  };

  if (!data.assetNo) {
    message("กรุณาสแกนหรือกรอก Asset No.", "red");
    return;
  }

  sending = true;

  const btn = $("submitBtn");
  btn.disabled = true;
  btn.textContent = "กำลังส่งข้อมูล...";

  const form = document.createElement("form");
  form.method = "POST";
  form.action = API_URL;
  form.target = "submitFrame";
  form.style.display = "none";

  const input = document.createElement("input");
  input.type = "hidden";
  input.name = "payload";
  input.value = JSON.stringify(data);

  form.appendChild(input);
  document.body.appendChild(form);

  form.submit();
  form.remove();

  message("ส่งคำขอแล้ว กำลังเตรียมรายการถัดไป");

  // Timed reset: not confirmation from Google Sheets.
  setTimeout(() => {
    $("assetForm").reset();
    $("assetNo").value = "";

    sending = false;
    scanLocked = false;

    btn.disabled = false;
    btn.textContent = "ส่งข้อมูล";

    message(
      "พร้อมสแกน QR รายการถัดไป (กรุณาตรวจสอบ CountLog)",
      "green"
    );
  }, 2000);
});
</script>
</body>
</html>
