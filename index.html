<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FA Physical Checking</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f1f5f9;
  color: #213547;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 450px;
  margin: auto;
  padding: 22px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
}

h2 {
  margin: 0 0 20px;
  text-align: center;
}

button {
  padding: 14px;
  min-height: 46px;
  font-size: 15px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  opacity: .55;
  cursor: default;
}

button:focus-visible {
  outline: 3px solid #e0a13b;
  outline-offset: 2px;
}

.modeButtons {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.modeButtons button {
  flex: 1;
  background: #e5e7eb;
}

.modeButtons button.active {
  background: #1769aa;
  color: white;
}

.scan {
  width: 100%;
  background: #233d53;
  color: white;
}

.submit {
  width: 100%;
  margin-top: 24px;
  background: #1769aa;
  color: white;
}

fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}

label.fieldLabel {
  display: block;
  font-weight: bold;
  margin: 18px 0 7px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 13px;
  font: 16px/1.4 Arial, sans-serif;
  color: #213547;
  border: 1px solid #bcc9d5;
  border-radius: 8px;
  background: white;
}

textarea {
  resize: vertical;
}

#assetNo {
  min-height: 50px;
  overflow-wrap: anywhere;
}

#assetNo[readonly] {
  background: #f0f4f8;
}

#assetNo.hasResult {
  background: #f0faf4;
  border-color: #67a781;
}

#viewport {
  position: relative;
  margin-top: 12px;
  border-radius: 12px;
  overflow: hidden;
  background: #101922;
}

#video {
  display: block;
  width: 100%;
  height: auto;
}

#guide {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 2px solid white;
  border-radius: 12px;
  box-shadow: 0 0 0 1000px #07142250;
  pointer-events: none;
}

.note {
  margin-top: 9px;
  color: #536779;
  font-size: 13px;
  line-height: 1.5;
}

#scanMessage,
#message {
  font-size: 14px;
  line-height: 1.5;
}

#message {
  margin: 15px 0 0;
  font-weight: bold;
  text-align: center;
}

#message:empty {
  display: none;
}

[data-kind="error"] {
  color: #a82824;
}

[data-kind="ok"] {
  color: #1c714b;
}

/* Each group allows only one selected value. */

.choiceGroup {
  margin-top: 18px;
}

.choiceGroup legend {
  font-weight: bold;
  margin-bottom: 8px;
  padding: 0;
}

.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.choice {
  position: relative;
  display: block;
  cursor: pointer;
  min-width: 0;
}

.choice input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  margin: 0;
  left: 8px;
  top: 50%;
}

.choice span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 48px;
  padding: 12px 8px;
  border: 1px solid #bcc9d5;
  border-radius: 9px;
  background: white;
  font-size: 14px;
  text-align: center;
}

.choice span::after {
  content: "";
  width: 12px;
  flex: 0 0 12px;
}

.choice input:checked + span {
  background: #1769aa;
  border-color: #1769aa;
  color: white;
}

.choice input:checked + span::after {
  content: "\2713";
}

.choice input:focus-visible + span {
  outline: 3px solid #e0a13b;
  outline-offset: 2px;
}

.choice input:disabled + span {
  opacity: .55;
  cursor: default;
}

.choiceGroup.invalid .choices {
  outline: 2px solid #a82824;
  outline-offset: 3px;
  border-radius: 9px;
}

/* Recent names, newest first. */

#ownerHistory {
  margin-top: 9px;
}

.historyHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.historyHeader span {
  color: #536779;
  font-size: 12px;
}

#clearOwners {
  min-height: 36px;
  padding: 6px 10px;
  background: transparent;
  color: #536779;
  font-size: 12px;
  text-decoration: underline;
}

#ownerSuggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.ownerChip {
  min-height: 42px;
  max-width: 100%;
  padding: 9px 12px;
  border: 1px solid #bed3e5;
  background: #edf5fc;
  color: #1769aa;
  border-radius: 20px;
  font-size: 14px;
  text-align: left;
  overflow-wrap: anywhere;
}

[hidden] {
  display: none !important;
}

@media (max-width: 360px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 16px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h2>FA Physical Checking</h2>

  <div class="modeButtons">
    <button id="scanMode"
            class="active"
            type="button"
            disabled>
      Scan QR
    </button>

    <button id="manualMode"
            type="button"
            disabled>
      Manual Entry
    </button>
  </div>

  <div id="scanSection">

    <button id="scanBtn"
            class="scan"
            type="button"
            disabled>
      Open camera / Scan QR
    </button>

    <div id="viewport" hidden>
      <video id="video"
             autoplay
             muted
             playsinline></video>

      <div id="guide" aria-hidden="true"></div>
    </div>

    <p class="note">
      Keep one QR tag in view. Hold steady and move
      slightly farther away if blurry.
    </p>

    <p id="scanMessage"
       role="status"
       aria-live="polite"></p>

  </div>

  <div id="manualNote" class="note" hidden>
    Use when a QR tag is missing, damaged, or cannot be read.
  </div>

  <form id="assetForm" novalidate>

    <fieldset id="formFields" disabled>

      <label class="fieldLabel" for="assetNo">
        Asset No. *
      </label>

      <textarea id="assetNo"
                rows="1"
                readonly
                required
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                placeholder="Please scan QR"></textarea>

      <fieldset id="statusGroup" class="choiceGroup">
        <legend>Status *</legend>
        <div id="statusChoices" class="choices"></div>
      </fieldset>

      <fieldset id="conditionGroup" class="choiceGroup">
        <legend>Condition *</legend>
        <div id="conditionChoices" class="choices"></div>
      </fieldset>

      <fieldset id="locationGroup" class="choiceGroup">
        <legend>Location *</legend>
        <div id="locationChoices" class="choices"></div>
      </fieldset>

      <label class="fieldLabel" for="owner">
        Owner
      </label>

      <input id="owner"
             type="text"
             autocomplete="off"
             placeholder="Responsible person (optional)">

      <div id="ownerHistory" hidden>

        <div class="historyHeader">
          <span>Recent owners - newest first</span>

          <button id="clearOwners" type="button">
            Clear
          </button>
        </div>

        <div id="ownerSuggestions"
             aria-label="Recent Owner names"></div>

      </div>

      <label class="fieldLabel" for="remark">
        Remark
      </label>

      <textarea id="remark"
                rows="3"
                placeholder="Remark (optional)"></textarea>

      <button id="submitBtn"
              class="submit"
              type="submit">
        Submit
      </button>

    </fieldset>

  </form>

  <p id="message"
     role="status"
     aria-live="polite"></p>

</div>

<script type="module">

const API_URL =
  "https://script.google.com/macros/s/AKfycbwezB2j68Bz65FXjJUSEFZIPJUTtvHp4-UDb3k8apBi9teP886Cd4lEqnDSiKvUbtjC/exec";

const LIBRARY_URL =
  "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

// Same reset timing as the original version.
// This is NOT a server confirmation.
const RESET_AFTER_MS = 2000;

const $ = id => document.getElementById(id);

const form = $("assetForm");
const video = $("video");

const activeFrames = new Set();

let currentMode = "scan";
let phase = "idle";
let sending = false;
let opening = false;

let stream = null;
let generation = 0;
let scanTimer = null;

// Preserve the exact decoded QR text separately.
let rawQrText = null;

let QrScanner = null;
let engine = null;
let decoderPromise = null;
let pendingDecode = Promise.resolve();

let requestNumber = 0;

const OWNER_HISTORY_KEY = "FA_PhysicalChecking.ownerHistory.v1";
const MAX_RECENT_OWNERS = 5;

let ownerHistory = loadOwnerHistory();


/* =====================================================
   SINGLE-CHOICE BUTTONS
===================================================== */

const OPTIONS = {
  status: [
    "Found",
    "Not Found"
  ],

  condition: [
    "Good",
    "Damaged"
  ],

  location: [
    "HQ-OFFICE",
    "WH-2",
    "WH-3",
    "WH-4",
    "SAMRONG",
    "MP-M",
    "MP-I"
  ]
};

function buildChoices() {
  for (const [name, values] of Object.entries(OPTIONS)) {
    const container = $(name + "Choices");

    values.forEach((value, index) => {
      const label = document.createElement("label");
      label.className = "choice";

      const input = document.createElement("input");
      input.type = "radio";
      input.name = name;
      input.id = name + "_" + index;
      input.value = value;
      input.required = true;

      const text = document.createElement("span");
      text.textContent = value;

      label.append(input, text);
      container.appendChild(label);

      input.addEventListener("change", () => {
        $(name + "Group").classList.remove("invalid");

        if ($("message").dataset.kind === "error") {
          message("");
        }
      });
    });
  }
}

function selectedValue(name) {
  return form.querySelector(
    'input[name="' + name + '"]:checked'
  )?.value || "";
}


/* =====================================================
   RECENT OWNER NAMES

   Stored in this browser only.
   No extra API request.
===================================================== */

function loadOwnerHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(OWNER_HISTORY_KEY) || "[]"
    );

    if (!Array.isArray(saved)) return [];

    const names = [];

    for (const value of saved) {
      if (typeof value !== "string") continue;

      const name = value.trim();

      if (
        name &&
        !names.some(
          item => item.toLowerCase() === name.toLowerCase()
        )
      ) {
        names.push(name);
      }

      if (names.length === MAX_RECENT_OWNERS) break;
    }

    return names;

  } catch (_) {
    return [];
  }
}

function rememberOwner(value) {
  const name = value.trim();

  if (!name) return;

  ownerHistory = [
    name,
    ...ownerHistory.filter(
      item => item.toLowerCase() !== name.toLowerCase()
    )
  ].slice(0, MAX_RECENT_OWNERS);

  try {
    localStorage.setItem(
      OWNER_HISTORY_KEY,
      JSON.stringify(ownerHistory)
    );

  } catch (_) {
    // Still suggest names in this open page if storage is blocked.
  }
}

function renderOwnerHistory() {
  const query = $("owner").value.trim().toLowerCase();

  const matches = ownerHistory.filter(
    name => name.toLowerCase().includes(query)
  );

  $("ownerHistory").hidden = matches.length === 0;

  $("ownerSuggestions").replaceChildren();

  for (const name of matches) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "ownerChip";
    button.textContent = name;

    button.setAttribute(
      "aria-label",
      "Use Owner: " + name
    );

    button.addEventListener("click", () => {
      if (sending) return;

      $("owner").value = name;
      renderOwnerHistory();
    });

    $("ownerSuggestions").appendChild(button);
  }
}

$("owner").addEventListener(
  "input",
  renderOwnerHistory
);

$("owner").addEventListener(
  "focus",
  renderOwnerHistory
);

$("clearOwners").addEventListener("click", () => {
  if (
    sending ||
    !confirm(
      "Clear recent Owner names on this browser? " +
      "Saved Google Sheets records will not be changed."
    )
  ) {
    return;
  }

  ownerHistory = [];

  try {
    localStorage.removeItem(OWNER_HISTORY_KEY);
  } catch (_) {}

  renderOwnerHistory();
});


/* =====================================================
   INTERFACE
===================================================== */

function message(text, kind = "") {
  $("message").textContent = text;
  $("message").dataset.kind = kind;
}

function scanMessage(text, kind = "") {
  $("scanMessage").textContent = text;
  $("scanMessage").dataset.kind = kind;
}

function refreshUI() {
  const scanning = phase !== "idle";
  const isScan = currentMode === "scan";

  $("scanSection").hidden = !isScan;
  $("manualNote").hidden = isScan;

  $("scanMode").classList.toggle("active", isScan);
  $("manualMode").classList.toggle("active", !isScan);

  $("scanMode").disabled = sending;
  $("manualMode").disabled = sending;

  $("assetNo").readOnly = isScan;

  $("assetNo").placeholder = isScan
    ? "Please scan QR"
    : "Enter Asset No. manually";

  $("formFields").disabled = sending;

  // Do not wait for previous server responses.
  $("submitBtn").disabled = sending || scanning;

  $("submitBtn").textContent = sending
    ? "Sending request..."
    : "Submit";

  $("scanBtn").disabled =
    sending || scanning || opening;

  $("scanBtn").textContent =
    phase === "opening"
      ? "Opening camera..."
      : phase === "live"
        ? "Camera active - scanning..."
        : opening
          ? "Camera permission pending..."
          : rawQrText !== null
            ? "Scan a different QR"
            : "Open camera / Scan QR";
}

function fitAsset() {
  $("assetNo").style.height = "auto";

  $("assetNo").style.height =
    Math.min(
      160,
      Math.max(50, $("assetNo").scrollHeight + 2)
    ) + "px";
}

function clearAsset() {
  rawQrText = null;

  $("assetNo").value = "";
  $("assetNo").classList.remove("hasResult");

  fitAsset();
}


/* =====================================================
   CAMERA CONTROL
===================================================== */

function releaseCamera() {
  ++generation;

  clearTimeout(scanTimer);
  scanTimer = null;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;

  video.pause();
  video.srcObject = null;

  $("viewport").hidden = true;
  phase = "idle";
}

function setMode(mode) {
  if (sending || mode === currentMode) return;

  releaseCamera();

  currentMode = mode;

  clearAsset();
  message("");
  scanMessage("");

  refreshUI();

  if (mode === "manual") {
    $("assetNo").focus();
  }
}


/* =====================================================
   QR READER
===================================================== */

async function loadDecoder() {
  if (!decoderPromise) {
    decoderPromise = (async () => {
      QrScanner = (await import(LIBRARY_URL)).default;
      engine = await QrScanner.createQrEngine();

    })().catch(() => {
      decoderPromise = null;

      throw new Error(
        "Cannot load QR reader. Check your connection " +
        "or use Manual Entry."
      );
    });
  }

  await decoderPromise;
}

function resetDecoder() {
  if (
    typeof Worker !== "undefined" &&
    engine instanceof Worker
  ) {
    engine.terminate();
  }

  engine = null;
  decoderPromise = null;
}

function updateGuide() {
  if ($("viewport").hidden) return;

  const rect = video.getBoundingClientRect();

  const size = Math.floor(
    Math.min(rect.width, rect.height) * 0.8
  );

  $("guide").style.width = size + "px";
  $("guide").style.height = size + "px";
}

function scanRegion(width, height, full) {
  const side = Math.max(
    1,
    Math.floor(Math.min(width, height) * 0.8)
  );

  const w = full ? width : side;
  const h = full ? height : side;

  const scale = Math.min(
    1,
    (full ? 1280 : 960) / Math.max(w, h)
  );

  return {
    x: full ? 0 : Math.floor((width - w) / 2),
    y: full ? 0 : Math.floor((height - h) / 2),

    width: w,
    height: h,

    downScaledWidth: Math.max(
      1,
      Math.round(w * scale)
    ),

    downScaledHeight: Math.max(
      1,
      Math.round(h * scale)
    )
  };
}

async function tuneFocus(track, token) {
  try {
    const caps = track.getCapabilities?.() || {};

    if (
      token !== generation ||
      !caps.focusMode?.includes("continuous")
    ) {
      return;
    }

    const existing = track.getConstraints?.() || {};

    await track.applyConstraints({
      ...existing,

      advanced: [
        ...(existing.advanced || []),
        { focusMode: "continuous" }
      ]
    });

  } catch (_) {
    // Keep scanning if focus control is unavailable.
  }
}

function acceptQr(text, token) {
  if (
    token !== generation ||
    sending ||
    currentMode !== "scan"
  ) {
    return;
  }

  if (
    typeof text !== "string" ||
    !text.length
  ) {
    return;
  }

  // Preserve the EXACT decoded string.
  // Do not trim, split, parse, or convert it to a number.
  rawQrText = text;

  $("assetNo").value = text;
  $("assetNo").classList.add("hasResult");

  fitAsset();
  releaseCamera();

  scanMessage(
    "QR read. Complete the fields, then press Submit.",
    "ok"
  );

  refreshUI();

  try {
    navigator.vibrate?.(70);
  } catch (_) {}
}


/* =====================================================
   START LIVE SCANNING
===================================================== */

async function startScanner() {
  if (
    sending ||
    phase !== "idle" ||
    opening ||
    currentMode !== "scan"
  ) {
    return;
  }

  releaseCamera();

  const token = generation;

  clearAsset();

  phase = "opening";
  opening = true;

  refreshUI();
  scanMessage("Opening camera...");

  let acquired = null;

  try {
    if (
      !window.isSecureContext ||
      !navigator.mediaDevices?.getUserMedia
    ) {
      throw new Error(
        "Open the app from your HTTPS website, " +
        "not a file preview."
      );
    }

    await pendingDecode.catch(() => {});

    if (token !== generation) return;

    await loadDecoder();

    if (token !== generation) return;

    try {
      acquired = await navigator.mediaDevices.getUserMedia({
        audio: false,

        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          frameRate: { ideal: 30 }
        }
      });

    } catch (error) {
      if (token !== generation) return;

      if (
        !["OverconstrainedError", "NotFoundError"]
          .includes(error?.name)
      ) {
        throw error;
      }

      acquired = await navigator.mediaDevices.getUserMedia({
        audio: false,

        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
    }

    if (token !== generation) {
      acquired.getTracks().forEach(track => track.stop());
      return;
    }

    stream = acquired;

    $("viewport").hidden = false;
    video.srcObject = stream;

    await video.play();

    if (token !== generation) return;

    const track = stream.getVideoTracks()[0];

    // Do not delay scanning while requesting autofocus.
    void tuneFocus(track, token);

    track.addEventListener(
      "ended",
      () => {
        if (token !== generation) return;

        releaseCamera();
        refreshUI();

        scanMessage(
          "Camera disconnected. Open the camera again.",
          "error"
        );
      },
      { once: true }
    );

    updateGuide();

    phase = "live";

    refreshUI();

    scanMessage(
      "Camera ready. Hold one QR tag steady."
    );

    const canvas = document.createElement("canvas");
    const began = performance.now();

    let attempts = 0;
    let errors = 0;

    async function tick() {
      if (
        token !== generation ||
        phase !== "live"
      ) {
        return;
      }

      if (
        video.readyState < 2 ||
        !video.videoWidth ||
        !video.videoHeight
      ) {
        scanTimer = setTimeout(tick, 100);
        return;
      }

      let result = null;
      let failure = null;

      try {
        pendingDecode = QrScanner.scanImage(video, {
          qrEngine: engine,
          canvas,

          scanRegion: scanRegion(
            video.videoWidth,
            video.videoHeight,
            ++attempts % 3 === 0
          ),

          returnDetailedScanResult: true
        });

        result = await pendingDecode;

      } catch (error) {
        failure = error;
      }

      if (
        token !== generation ||
        phase !== "live"
      ) {
        return;
      }

      if (
        typeof result?.data === "string" &&
        result.data.length
      ) {
        acceptQr(result.data, token);
        return;
      }

      errors =
        failure &&
        !/no qr code found/i.test(
          String(failure?.message || failure)
        )
          ? errors + 1
          : 0;

      if (errors >= 3) {
        releaseCamera();
        resetDecoder();
        refreshUI();

        scanMessage(
          "QR reader interrupted. Reopen the camera " +
          "or use Manual Entry.",
          "error"
        );

        return;
      }

      if (performance.now() - began > 6000) {
        scanMessage(
          "Not read yet. Move slightly farther away or reduce glare."
        );
      }

      // Never run two decoding attempts at the same time.
      scanTimer = setTimeout(tick, 90);
    }

    void tick();

  } catch (error) {
    if (acquired && acquired !== stream) {
      acquired.getTracks().forEach(track => track.stop());
    }

    if (token !== generation) return;

    releaseCamera();

    const errors = {
      NotAllowedError:
        "Allow camera access in your browser, then try again.",

      NotReadableError:
        "Camera is busy. Close other camera apps and retry.",

      NotFoundError:
        "Camera not found. Use Manual Entry."
    };

    scanMessage(
      errors[error?.name] ||
      String(error?.message || error),
      "error"
    );

  } finally {
    opening = false;
    refreshUI();
  }
}


/* =====================================================
   SUBMIT USING THE EXISTING API
===================================================== */

function postData(data) {
  const iframe = document.createElement("iframe");

  iframe.name =
    "submitFrame_" +
    Date.now() +
    "_" +
    (++requestNumber);

  iframe.title = "Submission response";
  iframe.hidden = true;
  iframe.src = "about:blank";

  const postForm = document.createElement("form");

  postForm.method = "POST";
  postForm.action = API_URL;
  postForm.target = iframe.name;
  postForm.acceptCharset = "UTF-8";
  postForm.hidden = true;

  const input = document.createElement("input");

  input.type = "hidden";
  input.name = "payload";
  input.value = JSON.stringify(data);

  postForm.appendChild(input);

  let posted = false;

  const cleanup = () => {
    iframe.onload = null;

    activeFrames.delete(iframe);

    iframe.remove();
    postForm.remove();
  };

  iframe.onload = () => {
    if (!posted) return;

    try {
      if (
        iframe.contentWindow.location.href === "about:blank"
      ) {
        return;
      }

    } catch (_) {}

    // Clean up only.
    // Do not reset the visible form or lock any buttons here.
    // An iframe load does NOT confirm that a row was saved.
    setTimeout(cleanup, 0);
  };

  document.body.appendChild(iframe);
  document.body.appendChild(postForm);

  activeFrames.add(iframe);

  try {
    HTMLFormElement.prototype.submit.call(postForm);
    posted = true;

  } catch (error) {
    cleanup();
    throw error;
  }
}


/* =====================================================
   SUBMIT + TWO-SECOND FORM RESET
===================================================== */

form.addEventListener("submit", event => {
  event.preventDefault();

  if (
    sending ||
    phase !== "idle"
  ) {
    return;
  }

  const data = {
    assetNo:
      currentMode === "scan"
        ? rawQrText
        : $("assetNo").value,

    status: selectedValue("status"),
    condition: selectedValue("condition"),
    location: selectedValue("location"),
    owner: $("owner").value,
    remark: $("remark").value
  };

  if (
    typeof data.assetNo !== "string" ||
    !data.assetNo.length
  ) {
    message(
      "Please scan or enter Asset No.",
      "error"
    );

    return;
  }

  for (const [name, title] of [
    ["status", "Status"],
    ["condition", "Condition"],
    ["location", "Location"]
  ]) {
    if (!data[name]) {
      $(name + "Group").classList.add("invalid");

      message(
        "Please select " + title + ".",
        "error"
      );

      $(name + "Group").querySelector("input").focus();

      return;
    }
  }

  if (!form.reportValidity()) return;

  if (navigator.onLine === false) {
    message(
      "Offline. Reconnect before submitting. " +
      "Your form has been kept.",
      "error"
    );

    return;
  }

  sending = true;

  releaseCamera();
  refreshUI();

  message("Sending request...");

  try {
    postData(data);
    rememberOwner(data.owner);

  } catch (_) {
    sending = false;
    refreshUI();

    message(
      "Cannot start the request. Your form has been kept.",
      "error"
    );

    return;
  }

  // Same timing as the first version.
  // No await, no server-response lock, no automatic retry.
  setTimeout(() => {
    form.reset();
    clearAsset();

    for (const name of Object.keys(OPTIONS)) {
      $(name + "Group").classList.remove("invalid");
    }

    renderOwnerHistory();

    sending = false;

    refreshUI();
    scanMessage("");

    message(
      "Request started. Ready for the next asset."
    );

  }, RESET_AFTER_MS);
});


/* =====================================================
   EVENTS
===================================================== */

$("scanMode").addEventListener(
  "click",
  () => setMode("scan")
);

$("manualMode").addEventListener(
  "click",
  () => setMode("manual")
);

$("scanBtn").addEventListener(
  "click",
  () => void startScanner()
);

$("assetNo").addEventListener(
  "input",
  fitAsset
);

video.addEventListener(
  "loadedmetadata",
  updateGuide
);

video.addEventListener(
  "resize",
  updateGuide
);

window.addEventListener(
  "resize",
  updateGuide
);

document.addEventListener("visibilitychange", () => {
  if (
    document.hidden &&
    phase !== "idle"
  ) {
    releaseCamera();
    refreshUI();

    scanMessage(
      "Camera released. Tap Open camera to resume."
    );
  }
});

window.addEventListener(
  "pagehide",
  releaseCamera
);

window.addEventListener(
  "pageshow",
  refreshUI
);

window.addEventListener("beforeunload", event => {
  if (
    sending ||
    activeFrames.size ||
    rawQrText !== null ||
    $("assetNo").value
  ) {
    event.preventDefault();
    event.returnValue = "";
  }
});


/* =====================================================
   INITIAL STATE
===================================================== */

buildChoices();
renderOwnerHistory();
refreshUI();

</script>

</body>
</html>
